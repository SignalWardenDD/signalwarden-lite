profile: v1_4_T_profit_first

symbols:
  - ADA_USDT
  - LTC_USDT
  - DOGE_USDT
  - ENA_USDT
  - HBAR_USDT
  - WIF_USDT
# PNUT_USDT отключена

timeframes: {primary: 1h, confirm: 15m}

risk:
  mode: fixed_margin
  margin_usdt: 15
  leverage: 5
  sl_atr_mult: 1.5
  cutloss_early: {enabled: false}

trailing:
  move_to_be_at_R: 0.40
  be_offset_R: 0.08
  activate_R: 0.35
  step_R: 0.25
  chandelier_k_atr: 3.5

regime:
  natr_period: 14
  calm_thresholds: {ultra_calm: 0.8, calm: 1.2, high: 2.5}

signals:
  dynamic_lookback: {calm: 24, normal: 16, high: 10}
  atr_cushion_long:   {calm: 0.30, normal: 0.12, high: 0.08}
  atr_cushion_short:  {calm: 0.32, normal: 0.14, high: 0.10}
  ltf_thinbar_k: 0.25
  setups:
    breakout:           {enabled: true}
    inside_bar:         {enabled: true, min_prev_range_k_atr: 0.5}
    trend_continuation: {enabled: true, min_body_k_range: 0.50, confirm_close_k_body: 0.20}
    squeeze_breakout:   {enabled: true, bb_period: 20, bb_k: 2.0, width_k_perc: 9.0}
    micro_breakout:     {enabled: false}  # отключено

market_filter:
  symbol: BTC_USDT          # обязательно иметь BTC_USDT_1h.pkl для бэктеста
  ema_fast: 50
  ema_slow: 200

short_guard:
  min_natr_perc: 1.2        # порог волатильности для шортов (в %)
  need_close_below_ema20: true
  slope_lookback: 3

directions:
  default: {allow_long: true, allow_short: true}
  symbol_overrides:
    DOGE_USDT: {allow_long: false, allow_short: true}   # DOGE лонги выключены
    ENA_USDT:  {allow_short: false}
    HBAR_USDT: {allow_short: false}
    WIF_USDT:  {allow_short: false}

quality:
  max_positions_per_symbol: 1
  max_trades_per_symbol_per_day_by_regime: {calm: 2, normal: 3, high: 4}

fees: {maker_bps: 2, taker_bps: 5}
slippage: {base_spread_mult: 1.0, stress_spread_mult: 2.0}

exchange:  {id: binanceusdm, testnet: true, rate_limit: true}
execution: {maker_first: true, ttl_seconds: 8, fallback_market: true, manage_stop: true}